name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: docker build -t signaltrade-notification:ci .
      - name: Smoke test installed worker package
        run: docker run --rm --entrypoint python signaltrade-notification:ci -c "import signaltrade_notification.worker"

  publish-staging-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: staging
    permissions: {contents: read, id-token: write}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with: {role-to-assume: "arn:aws:iam::832496385575:role/signaltrade-staging-github-notification-ecr", aws-region: us-east-1}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/build-push-action@v6
        with: {context: ., push: true, tags: "832496385575.dkr.ecr.us-east-1.amazonaws.com/signaltrade/notification:${{ github.sha }}"}
      - name: Request staging deployment
        env:
          GITOPS_DISPATCH_TOKEN: ${{ secrets.GITOPS_DISPATCH_TOKEN }}
        run: |
          if [[ -z "$GITOPS_DISPATCH_TOKEN" ]]; then
            echo "::warning::GITOPS_DISPATCH_TOKEN is not configured; image was published but not promoted."
            exit 0
          fi
          jq -n --arg service "notification" --arg tag "${{ github.sha }}" \
            '{event_type:"promote-staging-image",client_payload:{service:$service,tag:$tag}}' \
            | curl --fail-with-body --request POST \
                --header "Authorization: Bearer $GITOPS_DISPATCH_TOKEN" \
                --header "Accept: application/vnd.github+json" \
                --header "X-GitHub-Api-Version: 2022-11-28" \
                https://api.github.com/repos/KTCloud-Crypto/signaltrade-gitops/dispatches \
                --data-binary @-
